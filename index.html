<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GAMA Suite Demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1437; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
  #stage { position: absolute; inset: 0; margin: auto; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; overflow: hidden; background: #000; }
  #frame { position: absolute; left: 50%; bottom: 0; width: 100%; height: 100%; transform-origin: 50% 100%; transform: translateX(-50%) scale(var(--zoom, 1)); }
  #frame iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  #top { position: absolute; left: 0; right: 0; top: 0; height: 12.6%; background: #0b1437; color: #fff; display: flex; align-items: center; padding: 0 3%; box-sizing: border-box; border-bottom: 4px solid #f26522; }
  #top .logo { font-size: 2.6vw; font-weight: bold; letter-spacing: .04em; }
  #top .logo b { color: #f26522; }
  #top .live { margin-left: auto; font-size: 1.5vw; display: flex; align-items: center; opacity: .9; letter-spacing: .08em; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 20.8%; background: #0b1437; color: #fff; display: flex; align-items: center; padding: 0 3%; box-sizing: border-box; border-top: 4px solid #f26522; }
  .dot { width: 0.9vw; height: 0.9vw; min-width: 8px; min-height: 8px; border-radius: 50%; background: #f26522; margin-right: 1.2vw; animation: pulse 1.2s infinite; display: inline-block; }
  #bar .txt { font-size: 2.6vw; font-weight: bold; line-height: 1.2; }
  #bar .brand { margin-left: auto; font-size: 1.4vw; opacity: .8; letter-spacing: .08em; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .5; } 100% { transform: scale(1); opacity: 1; } }
  .nobar #bar, .nobar #top { display: none; }
  #load, #idle { position: absolute; left: 0; right: 0; top: 12.6%; bottom: 20.8%; background: #0b1437; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity .5s; }
  #load .big { font-size: 3vw; font-weight: bold; }
  #load .sub { font-size: 1.9vw; opacity: .85; margin-top: 1.2vw; }
  #load .dots span { display: inline-block; width: 1vw; height: 1vw; margin: 2vw .5vw 0; border-radius: 50%; background: #f26522; animation: pulse 1s infinite; }
  #load .dots span:nth-child(2) { animation-delay: .2s; } #load .dots span:nth-child(3) { animation-delay: .4s; }
  #idle { opacity: 0; pointer-events: none; }
  #idle.on { opacity: 1; }
  #idle .big { font-size: 3vw; font-weight: bold; }
  #idle .sub { font-size: 1.7vw; opacity: .85; margin: 1vw 0 1.6vw; }
  #idle .chip { font-size: 1.6vw; border: 2px solid #f26522; border-radius: 2vw; padding: .5vw 1.6vw; margin: .45vw; display: inline-block; }
  .hide { opacity: 0; pointer-events: none; }

  #scene { position: absolute; left: 0; right: 0; top: 12.6%; bottom: 20.8%; background: #f4f6fb; display: none; align-items: center; justify-content: center; flex-direction: column; color: #0b1437; text-align: center; }
  .scene-on #scene { display: flex; }
  .scene-on #frame, .scene-on #load { display: none; }
  #scene h2 { font-size: 2.5vw; margin: 0 0 1.6vw; }
  #scene .src { font-size: 1.05vw; color: #5b6478; margin-top: 1.2vw; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .cards { display: flex; align-items: stretch; }
  .pc { background: #fff; border-radius: 1.2vw; border-top: .6vw solid #f26522; width: 25vw; padding: 1.4vw 1.6vw; margin: 0 1vw; text-align: left; opacity: 0; transform: translateY(3vw); animation: rise .7s forwards; box-shadow: 0 .4vw 1.4vw rgba(11,20,55,.12); }
  .pc:nth-child(1) { animation-delay: .4s; } .pc:nth-child(2) { animation-delay: 1.8s; } .pc:nth-child(3) { animation-delay: 3.2s; }
  .pc .who { font-size: 1.1vw; color: #f26522; font-weight: bold; letter-spacing: .08em; }
  .pc h3 { font-size: 1.9vw; margin: .3vw 0 .8vw; }
  .pc div.li { font-size: 1.35vw; margin: .35vw 0; }
  .link { font-size: 1.5vw; font-weight: bold; margin-top: 1.6vw; opacity: 0; animation: rise .7s 4.6s forwards; }
  .fl { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 92vw; }
  .nd { font-size: 1.45vw; font-weight: bold; background: #fff; border: .22vw solid #0b1437; border-radius: 1vw; padding: 1vw 1.2vw; margin: .7vw .2vw; opacity: 0; transform: scale(.7); animation: rise .5s forwards, lit 12s infinite; }
  .nd small { display: block; font-weight: normal; font-size: 1.05vw; color: #5b6478; margin-top: .3vw; }
  .ar { font-size: 2vw; color: #f26522; margin: 0 .5vw; opacity: 0; animation: rise .4s forwards; }
  @keyframes lit { 0%, 12% { background: #f26522; color: #fff; border-color: #f26522; } 13%, 100% { background: #fff; color: #0b1437; border-color: #0b1437; } }
  .bars { display: flex; align-items: flex-end; height: 21vw; }
  .bw { margin: 0 4vw; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bv { font-size: 2.4vw; font-weight: bold; margin-bottom: .5vw; opacity: 0; animation: rise .5s forwards; }
  .bb { width: 11vw; height: 0; border-radius: .8vw .8vw 0 0; }
  @keyframes g1 { to { height: 15vw; } } @keyframes g2 { to { height: 1.8vw; } }
  .b1 { background: #9aa3b8; animation: g1 1.4s .4s forwards; } .b2 { background: #f26522; animation: g2 1.2s 2.4s forwards; }
  .bl { font-size: 1.4vw; margin-top: .6vw; font-weight: bold; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame"><div id="player"></div></div>
  <div id="scene"></div>
  <div id="load"><div class="big">Preparing your demo</div><div class="sub" id="loadtxt"></div><div class="dots"><span></span><span></span><span></span></div></div>
  <div id="idle"><div class="big">Nova is ready for your next question</div><div class="sub">You can ask her to show you:</div><div><span class="chip">How to create an inquiry</span><span class="chip">The dashboard</span><span class="chip">How to track quotations</span><span class="chip">Dangerous cargo</span><span class="chip">Containers and services</span></div></div>
  <div id="top"><span class="logo"><b>GAMA</b> Suite</span><span class="live"><span class="dot"></span>LIVE PRODUCT DEMO</span></div>
  <div id="bar"><span class="dot"></span><span class="txt" id="txt"></span><span class="brand">Presented by Nova</span></div>
</div>
<script>
  var raw = location.search.length > 1 ? location.search : ('?' + location.hash.replace(/^#/, ''));
  var q = new URLSearchParams(raw);
  var VIDEO = q.get('v') || '9dWIzGtRWOo';
  var START = parseFloat(q.get('start') || '0');
  var END = parseFloat(q.get('end') || '0');
  document.documentElement.style.setProperty('--zoom', q.get('zoom') || '1');
  document.getElementById('txt').textContent = q.get('title') || 'GAMA Suite product demo';
  if (q.get('bar') === '0') document.body.className = 'nobar';
  document.getElementById('loadtxt').textContent = q.get('title') || '';
  var IDLE = parseFloat(q.get('idle') || '35');
  function standby() { document.getElementById('idle').className = 'on'; document.getElementById('txt').textContent = 'Questions and answers'; }
  var VIEW = q.get('view');
  var SCENES = {
    portals: '<h2>One platform, three connected portals</h2><div class="cards">' +
      '<div class="pc"><div class="who">FOR YOUR CUSTOMERS</div><h3>Customer Portal</h3><div class="li">Send inquiries and book</div><div class="li">Track shipments</div><div class="li">Documents and invoices</div></div>' +
      '<div class="pc"><div class="who">FOR YOUR SALES TEAM</div><h3>CRM Portal</h3><div class="li">Leads and customers</div><div class="li">Deals and follow-ups</div><div class="li">Tasks and reports</div></div>' +
      '<div class="pc"><div class="who">FOR YOUR OPERATIONS</div><h3>Admin Portal</h3><div class="li">Inquiries and quotations</div><div class="li">Bookings and shipments</div><div class="li">BL, finance, analytics</div></div>' +
      '</div><div class="link">The same data flows through all three. Nothing is typed twice.</div>',
    flow: function () {
      var n = [['Inquiry', 'customer asks'], ['Vendor rates', 'request and receive'], ['Quotation', 'sent to customer'], ['Booking', 'confirmed'], ['Shipment', 'tracked live'], ['Documents', 'BL and more'], ['Invoice', 'billed']];
      var h = '<h2>From inquiry to invoice, in one flow</h2><div class="fl">';
      for (var i = 0; i < n.length; i++) {
        var d = (0.4 + i * 0.9).toFixed(1);
        h += '<div class="nd" style="animation-delay:' + d + 's,' + (7 + i * 1.5).toFixed(1) + 's">' + n[i][0] + '<small>' + n[i][1] + '</small></div>';
        if (i < n.length - 1) h += '<div class="ar" style="animation-delay:' + (0.8 + i * 0.9).toFixed(1) + 's">&#10140;</div>';
      }
      return h + '</div>';
    },
    time: '<h2>Time to quote and document one shipment</h2><div class="bars">' +
      '<div class="bw"><div class="bv" style="animation-delay:1.8s">35 min</div><div class="bb b1"></div><div class="bl">Before</div></div>' +
      '<div class="bw"><div class="bv" style="animation-delay:3.6s;color:#f26522">about 4 min</div><div class="bb b2"></div><div class="bl">With GAMA Suite</div></div>' +
      '</div><div class="src">Customer result published on gamasuite.com. Results depend on each company and workflow.</div>'
  };
  if (VIEW && SCENES[VIEW]) {
    document.body.classList.add('scene-on');
    document.getElementById('scene').innerHTML = typeof SCENES[VIEW] === 'function' ? SCENES[VIEW]() : SCENES[VIEW];
  } else {
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }
  var player, watcher;
  function noCaptions() { try { player.unloadModule('captions'); player.unloadModule('cc'); } catch (x) {} }
  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      width: '100%', height: '100%', videoId: VIDEO,
      playerVars: { autoplay: 1, mute: 1, controls: 0, rel: 0, start: Math.floor(START), playsinline: 1, disablekb: 1, modestbranding: 1, iv_load_policy: 3, fs: 0, cc_load_policy: 0 },
      events: {
        onReady: function (e) { e.target.mute(); noCaptions(); e.target.seekTo(START, true); e.target.playVideo(); },
        onStateChange: function (e) {
          noCaptions();
          if (e.data === YT.PlayerState.PLAYING) document.getElementById('load').className = 'hide';
          if (e.data === YT.PlayerState.PLAYING && END > START && !watcher) {
            watcher = setInterval(function () {
              if (player.getCurrentTime() >= END) { player.pauseVideo(); clearInterval(watcher); setTimeout(standby, IDLE * 1000); }
            }, 200);
          }
        }
      }
    });
  }
</script>
</body>
</html>
